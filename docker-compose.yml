services:
  mongo:
    image: mongo:${MONGO_VERSION:-8}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    restart: unless-stopped

  provas-gpt:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - .:/app
    environment:
      - PORT=${PORT}
      - SECRET_KEY=${SECRET_KEY}
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DB=${MONGO_DB:-exam_gpt}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - HORARIO_ENDPOINT=${HORARIO_ENDPOINT}
      - GROUPS_ENDPOINT=${GROUPS_ENDPOINT}
    depends_on:
      - mongo
    networks:
      - internal
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock
        - action: rebuild
          path: ./Dockerfile
        - action: sync+restart
          path: ./apps
          target: /app/apps
        - action: sync+restart
          path: ./templates
          target: /app/templates
        - action: sync+restart
          path: ./static
          target: /app/static
        - action: sync+restart
          path: ./settings
          target: /app/settings

networks:
  internal:
    driver: bridge

volumes:
  mongo_data:

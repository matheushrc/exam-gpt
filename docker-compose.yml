services:
  mongo:
    image: mongo:${MONGO_VERSION:-8}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    restart: unless-stopped

  provas-gpt:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT}:${PORT}"
    environment:
      - PORT=${PORT}
      - SECRET_KEY=${SECRET_KEY}
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DB=${MONGO_DB:-exam_gpt}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - HORARIO_ENDPOINT=${HORARIO_ENDPOINT}
      - GROUPS_ENDPOINT=${GROUPS_ENDPOINT}
    depends_on:
      - mongo
    networks:
      - internal
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./apps
          target: /app/apps
        - action: sync
          path: ./settings
          target: /app/settings
        - action: sync
          path: ./templates
          target: /app/templates
        - action: sync
          path: ./manage.py
          target: /app/manage.py
        - action: sync
          path: ./mongo_migrations
          target: /app/mongo_migrations
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock


networks:
  internal:
    driver: bridge

volumes:
  mongo_data:

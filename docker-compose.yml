services:
  mongo:
    image: mongo:${MONGO_VERSION:-8}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    restart: unless-stopped

  provas-gpt:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT}:${PORT}"
    environment:
      - PORT=${PORT}
      - SECRET_KEY=${SECRET_KEY}
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DB=${MONGO_DB:-exam_gpt}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - HORARIO_ENDPOINT=${HORARIO_ENDPOINT}
      - GROUPS_ENDPOINT=${GROUPS_ENDPOINT}
    depends_on:
      - mongo
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  mongo_data:

<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
              integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
              crossorigin="anonymous">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Testar apis</title>
    </head>
    <body>
        <form method="get">
            <select name="semester" onchange="this.form.submit()">
                <option value="">Semestres</option>
                {% for semester in semesters %}
                    <option value="{{ semester }}"
                            {% if semester == selected_semester %}selected{% endif %}>{{ semester }}</option>
                {% endfor %}
            </select>
            <select name="group"
                    onchange="this.form.submit()"
                    {% if not groups %}disabled{% endif %}>
                <option value="">Grupos</option>
                {% for group in groups %}
                    <option value="{{ group.id }}"
                            {% if group.id == selected_group %}selected{% endif %}>{{ group.name }}</option>
                {% endfor %}
            </select>
            <table name="schedule" class="table table-striped">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Materia</th>
                        <th scope="col">Créditos</th>
                        <th scope="col">Slots</th>
                        <th scope="col">Semestre</th>
                        <th scope="col">Professores</th>
                        <th scope="col">Dia da Semana</th>
                        <th scope="col">Periodo</th>
                    </tr>
                </thead>
                <tbody>
                    {% for class in schedule %}
                        <tr>
                            <th scope="row">{{ class.id }}</th>
                            <td>{{ class.name }}</td>
                            <td>{{ class.credits }}</td>
                            <td>{{ class.slots }}</td>
                            <td>{{ class.group }}</td>
                            <td>{{ class.members|join:", " }}</td>
                            <td>{{ class.weekDay }}</td>
                            <td>{{ class.period }}</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </form>
    </body>
</html>

[project]
name = "provas-gpt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.3"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "django-browser-reload>=1.21.0",
    "django-htmx>=1.27.0",
    "django-mongodb-backend>=6.0.3",
    "django-watchfiles>=1.4.0",
    "django>=6.0.6",
    "djangorestframework>=3.17.1",
    "djlint>=1.39.2",
    "drf-spectacular>=0.29.0",
    "loguru>=0.7.3",
    "numpy>=2.5.0",
    "pillow>=12.2.0",
    "pydantic-ai-slim[google,openai]>=1.107.0",
    "pydantic-settings>=2.14.2",
    "pydantic>=2.13.4",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "refinedoc>=1.0.1",
    "requests>=2.34.2",
    "ruff>=0.15.18",
    "sqlite-vec>=0.1.9",
    "turbovec>=0.8.0",
    "ty>=0.0.51",
    "whitenoise>=6.12.0",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "settings.settings"

[tool.ruff]
# Migration files are generated by Django/Mongo and must stay byte-stable
# except for legitimate migration-generation diffs; never reformat them.
extend-exclude = ["*/migrations/*", "mongo_migrations/*"]

[tool.djlint]
# H006: Img tag should have height and width attributes
# H013: Img tag should have an alt attribute
ignore = "H006,H013"
require_pragma = false
format = true
line_break_after_tag = "div,section"
indent = 4

[dependency-groups]
dev = ["django-stubs>=6.0.5"]
